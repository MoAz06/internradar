name: Deploy site

on:
  push:
    branches: [master]
  schedule:
    # every night, so passed deadlines and start dates show as closed and dead links get caught. The Worker
    # starts it on time at 03:30 UTC; this schedule is the spare, see the job spare below.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: read

jobs:
  # GitHub's schedule runs hours late; the Worker (worker/src/index.ts in MoAz06/internradar) starts this
  # workflow on time. The schedule is the spare: it only runs when nothing started the workflow in the last 20 hours.
  spare:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          since="$(date -u -d '20 hours ago' +%FT%TZ)"
          n="$(gh run list --workflow deploy.yml --event workflow_dispatch --created ">=$since" --json databaseId --jq length)"
          echo "Started in the last 20 hours: $n"
          echo "skip=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: spare
    if: ${{ !cancelled() && needs.spare.outputs.skip != 'true' }}
    # on the job, not the workflow, so a spare run that skips never cancels a build
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      # search, pay, filters, profile, share form and reminders; a failure here stops the deploy
      - run: npm run test-site
      # a push reuses the posting check from the last full run, so it goes live in a minute or two
      - name: Last posting check
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: site/.linkcheck.json
          key: linkcheck-${{ github.run_id }}
          restore-keys: linkcheck-
      # a broken check must not stop the deploy, the site then just shows no gone postings
      - name: Check the posting links
        id: linkcheck
        if: github.event_name != 'push' || hashFiles('site/.linkcheck.json') == ''
        run: npm run linkcheck
        continue-on-error: true
      - name: Keep the posting check for pushes
        if: steps.linkcheck.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: site/.linkcheck.json
          key: linkcheck-${{ github.run_id }}
      - name: Update the gone-postings issue
        if: steps.linkcheck.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create linkcheck --color d4c5f9 --description "Postings the nightly check could not find" 2>/dev/null || true
          n=$(gh issue list --label linkcheck --state open --json number --jq '.[0].number')
          if [ -s .linkcheck.md ]; then
            if [ -n "$n" ]; then gh issue edit "$n" --body-file .linkcheck.md
            else gh issue create --title "Postings that look gone" --label linkcheck --body-file .linkcheck.md; fi
          elif [ -n "$n" ] && [ -f .linkcheck.json ]; then
            gh issue close "$n" --comment "Every posting loads again."
          fi
      # new roles on the job boards are found by the private inbox repo at night (npm run discover and
      # role-drafts), where each one becomes a draft to check before it goes on the list
      - run: npm run build
        env:
          # served at /indexnow.txt, so the search engines on IndexNow can check the nightly pings
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - run: echo internradar.eu > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    # without this, the skipped spare job before build would skip the deploy too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    concurrency:
      group: pages-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # tells Google (its Indexing API, for the job pages) and the search engines on IndexNow which pages changed
  # tonight, so they come back within hours instead of weeks. Both scripts do nothing without their secret.
  notify:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      # the two scripts use only Node itself and the site's own files, so nothing is installed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the night's posting check, so a role whose posting is gone counts as closed here too
      - uses: actions/cache/restore@v4
        with:
          path: site/.linkcheck.json
          key: linkcheck-${{ github.run_id }}
          restore-keys: linkcheck-
      - run: npm run indexnow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      # Google allows about 200 notifications a day, so only the night's run spends them, not every push
      - run: npm run google-index
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
