name: Deploy site

on:
  push:
    branches: [master]
  schedule:
    # every night, so passed deadlines and start dates show as closed and dead links get caught
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      # a push reuses the posting check from the last full run, so it goes live in a minute or two
      - name: Last posting check
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: site/.linkcheck.json
          key: linkcheck-${{ github.run_id }}
          restore-keys: linkcheck-
      # a broken check must not stop the deploy, the site then just shows no gone postings
      - name: Check the posting links
        id: linkcheck
        if: github.event_name != 'push' || hashFiles('site/.linkcheck.json') == ''
        run: npm run linkcheck
        continue-on-error: true
      - name: Keep the posting check for pushes
        if: steps.linkcheck.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: site/.linkcheck.json
          key: linkcheck-${{ github.run_id }}
      - name: Update the gone-postings issue
        if: steps.linkcheck.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create linkcheck --color d4c5f9 --description "Postings the nightly check could not find" 2>/dev/null || true
          n=$(gh issue list --label linkcheck --state open --json number --jq '.[0].number')
          if [ -s .linkcheck.md ]; then
            if [ -n "$n" ]; then gh issue edit "$n" --body-file .linkcheck.md
            else gh issue create --title "Postings that look gone" --label linkcheck --body-file .linkcheck.md; fi
          elif [ -n "$n" ] && [ -f .linkcheck.json ]; then
            gh issue close "$n" --comment "Every posting loads again."
          fi
      # new early-career roles on the job boards the listed companies use, for a check by hand
      # only at night: it takes half an hour and the build doesn't need it
      - run: npm run discover
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
      - name: Update the new-roles issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create new-roles --color c2e0c6 --description "Roles on company job boards that are not on the list yet" 2>/dev/null || true
          n=$(gh issue list --label new-roles --state open --json number --jq '.[0].number')
          if [ -s .discover.md ]; then
            if [ -n "$n" ]; then gh issue edit "$n" --body-file .discover.md
            else gh issue create --title "New roles to look at" --label new-roles --body-file .discover.md; fi
          fi
      - run: npm run build
      - run: echo internradar.eu > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
